apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-cicd-app
  labels:
    app: flask-cicd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-cicd-app
  template:
    metadata:
      labels:
        app: flask-cicd-app
    spec:
      containers:
      - name: flask-cicd-app
        image: vijay14082003/flask-cicd-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: flask-cicd-app-service
spec:
  type: NodePort
  selector:
    app: flask-cicd-app
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30090
